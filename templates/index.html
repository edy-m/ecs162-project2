<!DOCTYPE html>
<html lang="ca">
    <!--
        lecture 2 and 3 slides from class - syntax, formatting, and general structure for implementing html
        and css functionality
        (https://docs.google.com/presentation/d/e/2PACX-1vTG2mKIEEt7XfsP2XXNA1sD0Wgfyo1oX4fYFq62qWs1ZgmxS0LRIx6gomeEBpVTLG6EDytbMdwyXpHu/pub?start=false&loop=false&delayms=3000&slide=id.g94d7922f30_0_70)
        (https://docs.google.com/presentation/d/e/2PACX-1vR8fpanvQrI3JnGPNx8Je1xK8vUYkdLTJa6RsL_oOPQN7zXyllZn6ddanvaf65QxwcpoYIKvU8HKcSs/pub?start=false&loop=false&delayms=3000&slide=id.g3470a501663_0_116)
        -->
    <head>
        <meta charset="UTF-8">
        <!-- link css and html-->
        <link rel="stylesheet" href="styles.css">
        <!--
            w3schools - for help implementing meta tag that allows for viewport control,
            single column implementation for small screens wouldn't work without this
            (https://www.w3schools.com/css/css_rwd_viewport.asp)
            -->
        <!-- Allow for device scaling-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edy's NY Times Page</title>
    </head>
    <body>
        <header>
            <!-- header (h1) includes ny times label, date/time, nav bar-->
            <div id="h1">
                <div id="date"></div>
                <!--
                    SheCodes - for syntax and js functions needed to implement the current date/time 
                    using a js script
                    (https://www.shecodes.io/athena/72750-how-to-inject-current-day-and-time-into-html)
                    -->
                <!-- js script that updates date/time to current-->
                <script>
                    //create date/time variable
                    var now = new Date();
                    var date = now.toLocaleString();
                    //write onto page
                    document.getElementById("date").innerHTML = date;
                  </script>
                <div id="title">The New York Times</div>
                <!-- unused third flex box, keeps title centered-->
                <div id="blank"></div>
            </div>
            <!--
                w3schools - for syntax and strategy for implementing nav section within a header
                (https://www.w3schools.com/css/css_navbar.asp)
                -->
            <!-- nav bar under page title, includes contents of page-->
            <nav>
                <div>Top Stories</div>
                <div>Local</div>
                <div>Sacramento/Davis</div>
            </nav>
            <!-- placeholder for css to create a second border under the navbar-->
            <div id="doubleBorder"></div>
        </header>
        <main>
            <!-- main (h2) contains content like pictures, titles, paragraphs and borders to
             mimic the ny times front page -->
            <div id="h2">
                <!-- three different columns, each containing 2 articles (sandwiches in this case)-->
                <div id="column1">
                    <!-- 
                        Image source: New York Times search using filter: "sacramento"
                        Thumbnail picture used for first article from search results
                        -->
                    <!-- inserts article 1 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="unoImage" src="" alt="Article 1 image" title="pic">
                    <!-- Title of first article from search
                        will show "...loading..." as information is in the process of being fetched -->
                    <div id="uno"><strong id="unoTitle">...Loading...</strong></div>

                    <div id="unoText">...Loading...</div>
                    <!--
                        week 4 discussion slides and lectures 9 & 10 slides from class - 
                        help using nyt search api and setup/structure/usage for fetch function
                        (https://canvas.ucdavis.edu/courses/993295/files/folder/Lab%20Materials/week%204?preview=27512103)
                        (https://docs.google.com/presentation/d/1PROc0HjCUyOMOEiZUcKLrqo-FQO9kvez4cb09ElfSFM/edit#slide=id.g34f3b6bcb4f_0_35)
                        (https://docs.google.com/presentation/d/1-JOfz_l8b8m_cMky4AM6cct6PX_VM0zVOKws3qqLA9Y/edit#slide=id.gd6b56daeb7_0_131)
                        -->

                    <!--
                        nytimes developers - for help writing nyt search api queries using filters
                        also help identifying keywords used for parsing article data such as snippet,
                        multimedia, default, url, headline, main, etc.
                        (https://developer.nytimes.com/docs/articlesearch-product/1/overview)
                        (https://developer.nytimes.com/docs/articlesearch-product/1/types/Article)
                        -->

                    <!-- js script that fetches info from the nyt using their search api
                        the nyt search api uses the "sacramento" filter to get local stories
                        also uses our given api search key 
                        fetches search data, parses data to extract first article (data.response.docs[0]),
                        extract leading image from said article (article1.multimedia), 
                        set that image url as image src (img1.src = multimedia1.default.url),
                        extract article title (article1.headline.main) and description (article1.snippet) to be displayed onto page
                        catch error if we weren't able to fetch any data -->
                    <script>
                        let url1 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'
                        
                        fetch(url1)
                            .then(response => response.json())
                            .then(data => {
                                const article1 = data.response.docs[0];
                                const multimedia1 = article1.multimedia;
                                const img1 = document.getElementById('unoImage');
                                img1.src = multimedia1.default.url;
                                const title1 = article1.headline.main;
                                const snippet1 = article1.snippet;
                                document.getElementById('unoTitle').textContent = title1;
                                document.getElementById('unoText').textContent = snippet1;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>

                    <!-- essentially repeat the process for the next article from the api search
                        which will be placed under the previous one 
                        this is for the fourth article that appears from the search -->

                    <!-- Title of first article from search
                        will show "...loading..." as information is in the process of being fetched -->
                    <div id="quatro"><strong id="quatroTitle">...Loading...</strong></div>

                    <div id="quatroText">...Loading...</div>
                    <script>
                        let url4 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'
            
                        fetch(url4)
                            .then(response => response.json())
                            .then(data => {
                                const article4 = data.response.docs[3];
                                const multimedia4 = article4.multimedia;
                                const img4 = document.getElementById('quatroImage');
                                img4.src = multimedia4.default.url;
                                const title4 = article4.headline.main;
                                const snippet4 = article4.snippet;
                                document.getElementById('quatroTitle').textContent = title4;
                                document.getElementById('quatroText').textContent = snippet4;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>
                    <!-- inserts article 4 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="quatroImage" src="" alt="Article 4 image" title="pic">
                </div>
                <!-- repeat process for columns 2 and three-->
                <div id="column2">
                    <div id="dos"><strong id="dosTitle">...Loading...</strong></div>

                    <div id="dosText">...Loading...</div>
                    <script>
                        let url2 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'
                
                        fetch(url2)
                            .then(response => response.json())
                            .then(data => {
                                const article2 = data.response.docs[1];
                                const multimedia2 = article2.multimedia;
                                const img2 = document.getElementById('dosImage');
                                img2.src = multimedia2.default.url;
                                const title2 = article2.headline.main;
                                const snippet2 = article2.snippet;
                                document.getElementById('dosTitle').textContent = title2;
                                document.getElementById('dosText').textContent = snippet2;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>
                    <!-- inserts article 2 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="dosImage" src="" alt="Article 2 image" title="pic">
                    <!-- inserts article 5 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="cincoImage" src="" alt="Article 5 image" title="pic 5">
                    <div id="cinco"><strong id="cincoTitle">...Loading...</strong></div>
    
                    <div id="cincoText">...Loading...</div>
                    <script>
                        let url5 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'
                
                        fetch(url5)
                            .then(response => response.json())
                            .then(data => {
                                const article5 = data.response.docs[4];
                                const multimedia5 = article5.multimedia;
                                const img5 = document.getElementById('cincoImage');
                                img5.src = multimedia5.default.url;
                                const title5 = article5.headline.main;
                                const snippet5 = article5.snippet;
                                document.getElementById('cincoTitle').textContent = title5;
                                document.getElementById('cincoText').textContent = snippet5;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>
                </div>
                <div id="column3">
                    <!-- inserts article 3 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="tresImage" src="" alt="Article 3 image" title="pic 3">
                    <div id="tres"><strong id="tresTitle">...Loading...</strong></div>

                    <div id="tresText">...Loading...</div>
                    <script>
                        let url3 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'
            
                        fetch(url3)
                            .then(response => response.json())
                            .then(data => {
                                const article3 = data.response.docs[2];
                                const multimedia3 = article3.multimedia;
                                const img3 = document.getElementById('tresImage');
                                img3.src = multimedia3.default.url;
                                const title3 = article3.headline.main;
                                const snippet3 = article3.snippet;
                                document.getElementById('tresTitle').textContent = title3;
                                document.getElementById('tresText').textContent = snippet3;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>

                    <div id="seis"><strong id="seisTitle">...Loading...</strong></div>

                    <div id="seisText">...Loading...</div>
                    <script>
                        let url6 = 'https://api.nytimes.com/svc/search/v2/articlesearch.json?q=sacramento&api-key=LwRGjUYN8Phbf9LXDJZmzm7Ab99CQmke'

                        fetch(url6)
                            .then(response => response.json())
                            .then(data => {
                                const article6 = data.response.docs[5];
                                const multimedia6 = article6.multimedia;
                                const img6 = document.getElementById('seisImage');
                                img6.src = multimedia6.default.url;
                                const title6 = article6.headline.main;
                                const snippet6 = article6.snippet;
                                document.getElementById('seisTitle').textContent = title6;
                                document.getElementById('seisText').textContent = snippet6;
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>
                    <!-- inserts article 6 image 
                        source is defined in the fetch call by extracting the url of the article image-->
                    <img id="seisImage" src="" alt="Article 6 image" title="pic">
                </div>
            </div>
        </main>
        <footer>
            <!-- footer simply contains three flex boxes to mimic the actual ny times footer links-->
            <div>Contact</div>
            <div>Help</div>
            <div>Terms of Service</div>
        </footer>
    </body>
</html>
